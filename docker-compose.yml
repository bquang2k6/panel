services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://supabase.locket-dio.com}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dash.locket-dio.com}
    container_name: dash-locketdio
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: apps/main/.env.local
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000